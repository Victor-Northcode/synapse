# Codemagic: сборка подписанного IPA и автозаливка в TestFlight.
#
# Перед первым запуском в UI Codemagic (Teams → Integrations →
# Developer Portal → App Store Connect) добавьте API-ключ ASC и назовите
# интеграцию ровно `synapse_asc` — это имя используется ниже.
# Подпись автоматическая: сертификат и профиль Codemagic создаст сам
# через этот же ключ, ничего вручную выпускать не нужно.

workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: synapse_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.synapse.link
      vars:
        APP_STORE_APPLE_ID: 6797268513
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build signed ipa
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          LATEST=${LATEST:-0}
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        
  android-release:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: 3.44.6
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
